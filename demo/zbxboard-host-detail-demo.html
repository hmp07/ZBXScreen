<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>ZBXBoard · 主机详情演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============ Design Tokens ============ */
:root {
  --bg-1: #05080f;
  --bg-2: #081628;
  --bg-3: #0d2a4a;
  --panel-bg: rgba(8, 24, 48, 0.6);
  --panel-border: rgba(0, 229, 255, 0.24);
  --primary: #00e5ff;
  --primary-2: #00b8d4;
  --primary-glow: rgba(0, 229, 255, 0.4);
  --success: #52c41a;
  --warning: #faad14;
  --danger: #f5222d;
  --disaster: #820014;
  --info: #1890ff;
  --text-1: #e6f7ff;
  --text-2: #a8c4d8;
  --text-3: #6b89a3;
  --text-4: #455a72;
  --grid: rgba(0, 229, 255, 0.04);
  --font-num: 'Orbitron', 'Share Tech Mono', 'Consolas', monospace;
  --font-cn:  'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-cn);
  color: var(--text-1);
  background: #000;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse at top, rgba(0, 229, 255, 0.05), transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

#particleCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0, 229, 255, 0.04); }
::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.4); }

/* ============ Layout ============ */
.scale-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
.scale-inner {
  transform-origin: center center;
  position: relative;
}

.dashboard {
  position: relative;
  width: 1920px;
  height: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 64px 100px 1fr;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px 16px;
  z-index: 1;
}

/* ============ Top Bar (Header + Toolbar) ============ */
.topbar {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  overflow: hidden;
}
.topbar::before, .topbar::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary) 50%, transparent);
  opacity: 0.5;
}
.topbar::before { top: 0; }
.topbar::after  { bottom: 0; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-3);
}
.breadcrumb a {
  color: var(--text-2);
  text-decoration: none;
  transition: color 0.2s;
}
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb .sep { color: var(--text-4); }
.breadcrumb .current { color: var(--primary); font-weight: 500; }
.breadcrumb .home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  transition: color 0.2s;
  cursor: pointer;
}
.breadcrumb .home:hover { color: var(--primary); }
.home-logo {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-num);
  font-weight: 900; color: #001a2b; font-size: 14px;
  box-shadow: 0 0 12px var(--primary-glow);
}
.home-text {
  font-family: var(--font-num);
  font-weight: 700;
  letter-spacing: 1.5px;
}

.host-title {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
}
.host-name {
  font-family: var(--font-num);
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(90deg, #fff, var(--primary));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 1px;
}
.host-ip {
  font-family: var(--font-num);
  font-size: 13px;
  color: var(--text-3);
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 4px;
  letter-spacing: 1px;
}
.status-badge.ok {
  background: rgba(82, 196, 26, 0.12);
  border: 1px solid var(--success);
  color: var(--success);
}
.status-badge.problem {
  background: rgba(245, 34, 45, 0.12);
  border: 1px solid var(--danger);
  color: var(--danger);
}
.status-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  animation: status-pulse 1.5s infinite;
}
@keyframes status-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.clock {
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 2px;
  text-shadow: 0 0 8px var(--primary-glow);
}
.theme-switcher {
  display: flex;
  gap: 6px;
  padding: 3px 6px;
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  background: rgba(0, 229, 255, 0.04);
}
.theme-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: #fff; box-shadow: 0 0 8px currentColor; }
.theme-dot[data-color="cyan"]    { background: #00e5ff; color: #00e5ff; }
.theme-dot[data-color="purple"]  { background: #7b61ff; color: #7b61ff; }
.theme-dot[data-color="green"]   { background: #52c41a; color: #52c41a; }
.theme-dot[data-color="orange"]  { background: #ff7a45; color: #ff7a45; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--panel-border);
  background: rgba(0, 229, 255, 0.04);
  color: var(--text-2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  font-family: var(--font-cn);
}
.back-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(0, 229, 255, 0.08);
  transform: translateX(-2px);
}

/* ============ KPI Strip ============ */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 0 6px;
}
.kpi {
  position: relative;
  height: 100%;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  padding: 0 22px;
  gap: 16px;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
}
.kpi::before, .kpi::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border: 2px solid var(--primary);
  opacity: 0.7;
}
.kpi::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.kpi::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 18px var(--primary-glow);
}
.kpi-icon {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.03));
  border: 1px solid var(--panel-border);
  border-radius: 6px;
}
.kpi-body { min-width: 0; }
.kpi-label {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.kpi-label::before {
  content: '';
  display: inline-block;
  width: 3px; height: 8px;
  background: var(--primary);
}
.kpi-value-row {
  display: flex; align-items: baseline; gap: 6px;
}
.kpi-value {
  font-family: var(--font-num);
  font-size: 32px;
  font-weight: 900;
  color: var(--primary);
  line-height: 1;
  text-shadow: 0 0 12px var(--primary-glow);
  font-variant-numeric: tabular-nums;
}
.kpi-value.bump { animation: bump 0.4s ease; }
@keyframes bump {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); text-shadow: 0 0 24px var(--primary); }
}
.kpi-unit { font-size: 12px; color: var(--text-3); }
.kpi-bar {
  margin-top: 6px;
  position: relative;
  height: 4px;
  background: rgba(255,255,255,0.05);
  border-radius: 2px;
  overflow: hidden;
}
.kpi-bar-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  border-radius: 2px;
  box-shadow: 0 0 6px var(--primary-glow);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ============ Panel ============ */
.panel {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.3s;
  transform-style: preserve-3d;
}
.panel::before, .panel::after,
.panel > .corner-tl, .panel > .corner-tr,
.panel > .corner-bl, .panel > .corner-br {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border: 2px solid var(--primary);
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  animation: corner-draw 1.2s ease-out forwards;
}
.panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; animation-delay: 0.35s; }
.panel > .corner-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel > .corner-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; animation-delay: 0.15s; }
.panel > .corner-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; animation-delay: 0.25s; }
@keyframes corner-draw {
  0% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
  100% { opacity: 0.8; transform: scale(1); }
}

.panel-title {
  height: 36px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  background: linear-gradient(90deg, rgba(0, 229, 255, 0.1), transparent);
  flex-shrink: 0;
}
.panel-title-text {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title-text::before {
  content: '';
  display: inline-block;
  width: 4px; height: 14px;
  background: linear-gradient(180deg, var(--primary), transparent);
}
.panel-title-en {
  font-size: 11px;
  color: var(--text-4);
  font-family: var(--font-num);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-left: 6px;
}
.panel-title-tools {
  display: flex; gap: 10px; align-items: center;
  font-size: 11px;
  color: var(--text-3);
}
.panel-body { flex: 1; position: relative; padding: 10px 14px; min-height: 0; overflow: auto; }
.panel-body.no-pad { padding: 0; }

/* ============ Main Layout ============ */
.main-area {
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  min-height: 0;
}
.main-area > .panel { min-height: 0; }
.main-area > .panel.col-1 { grid-column: 1; grid-row: 1; }
.main-area > .panel.col-2 { grid-column: 1; grid-row: 2; }
.main-area > .panel.col-3 { grid-column: 2; grid-row: 1 / 3; }

/* ============ Info Grid ============ */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.info-cell {
  padding: 8px 10px;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.08);
  border-right: 1px dashed rgba(0, 229, 255, 0.08);
}
.info-cell:nth-child(2n) { border-right: 0; }
.info-cell:nth-last-child(-n+2) { border-bottom: 0; }
.info-cell-label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.info-cell-value {
  font-size: 13px;
  color: var(--text-1);
  font-weight: 500;
  font-family: var(--font-num);
}
.info-cell-value.highlight {
  color: var(--primary);
  text-shadow: 0 0 6px var(--primary-glow);
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  font-size: 11px;
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.3);
  color: var(--primary);
  border-radius: 3px;
  margin: 2px 4px 2px 0;
  font-family: var(--font-num);
}
.tag.warn { color: var(--warning); border-color: rgba(250, 173, 20, 0.4); background: rgba(250, 173, 20, 0.08); }
.tag.danger { color: var(--danger); border-color: rgba(245, 34, 45, 0.4); background: rgba(245, 34, 45, 0.08); }

/* ============ Trigger / Item List ============ */
.tlist { display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.trow {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: rgba(0, 229, 255, 0.03);
  border: 1px solid rgba(0, 229, 255, 0.1);
  border-left: 3px solid var(--text-4);
  font-size: 12px;
  transition: background 0.2s;
}
.trow:hover { background: rgba(0, 229, 255, 0.06); }
.trow.problem { border-left-color: var(--danger); }
.trow.ack     { border-left-color: var(--warning); }
.trow.ok      { border-left-color: var(--success); }
.tdot { width: 8px; height: 8px; border-radius: 50%; }
.trow.problem .tdot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.trow.ack .tdot     { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.trow.ok .tdot      { background: var(--success); }
.tname { color: var(--text-1); font-weight: 500; }
.tmeta { color: var(--text-3); font-size: 11px; margin-top: 2px; font-family: var(--font-num); }
.tval { font-family: var(--font-num); color: var(--primary); font-size: 13px; font-weight: 600; }
.tsev {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 2px;
  color: #fff;
  margin-right: 6px;
  font-weight: 700;
}
.tsev.disaster { background: var(--disaster); }
.tsev.high     { background: var(--danger); }
.tsev.average  { background: var(--warning); color: #2b1d00; }
.tsev.warning  { background: #fa8c16; }
.tsev.info     { background: var(--info); }
.tsev.not_classified { background: var(--text-3); }

/* ============ Item Table ============ */
.item-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.item-table thead th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text-3);
  font-size: 11px;
  letter-spacing: 1px;
  font-weight: 500;
  border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  background: rgba(0, 229, 255, 0.04);
  position: sticky;
  top: 0;
  z-index: 1;
}
.item-table tbody td {
  padding: 7px 10px;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.06);
}
.item-table tbody tr {
  transition: background 0.2s;
}
.item-table tbody tr:hover { background: rgba(0, 229, 255, 0.04); }
.item-table tbody tr:nth-child(even) { background: rgba(0, 229, 255, 0.015); }
.item-table tbody tr:nth-child(even):hover { background: rgba(0, 229, 255, 0.04); }
.item-name { color: var(--text-1); font-family: var(--font-num); }
.item-key { color: var(--text-3); font-size: 10px; font-family: var(--font-num); margin-top: 2px; }
.item-val { font-family: var(--font-num); color: var(--primary); font-weight: 600; text-align: right; }
.item-val.warn { color: var(--warning); }
.item-val.danger { color: var(--danger); }
.item-meta { color: var(--text-3); font-family: var(--font-num); font-size: 11px; }

/* mini sparkline cell */
.spark { width: 100%; height: 24px; }

/* ============ Search box ============ */
.search-box {
  position: relative;
  flex: 1;
  max-width: 240px;
}
.search-box input {
  width: 100%;
  padding: 4px 10px 4px 28px;
  background: rgba(0, 229, 255, 0.04);
  border: 1px solid var(--panel-border);
  color: var(--text-1);
  font-size: 12px;
  font-family: var(--font-cn);
  border-radius: 2px;
  outline: none;
  transition: all 0.2s;
}
.search-box input:focus {
  border-color: var(--primary);
  background: rgba(0, 229, 255, 0.08);
}
.search-box::before {
  content: '🔍';
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  opacity: 0.6;
}

/* ============ Tabs ============ */
.tabs {
  display: flex;
  gap: 4px;
}
.tab {
  padding: 4px 12px;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--panel-border);
  color: var(--text-3);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
  font-family: var(--font-cn);
}
.tab:hover { color: var(--text-1); }
.tab.active {
  background: rgba(0, 229, 255, 0.12);
  border-color: var(--primary);
  color: var(--primary);
}

/* ============ Chart container ============ */
.chart { width: 100%; height: 100%; }

/* ============ Theme ============ */
body[data-theme="cyan"]   { --primary: #00e5ff; --primary-2: #00b8d4; --primary-glow: rgba(0, 229, 255, 0.4); }
body[data-theme="purple"] { --primary: #7b61ff; --primary-2: #5b45e0; --primary-glow: rgba(123, 97, 255, 0.4); }
body[data-theme="green"]  { --primary: #52c41a; --primary-2: #389e0d; --primary-glow: rgba(82, 196, 26, 0.4); }
body[data-theme="orange"] { --primary: #ff7a45; --primary-2: #d4380d; --primary-glow: rgba(255, 122, 69, 0.4); }
</style>
</head>
<body data-theme="cyan">

<canvas id="particleCanvas"></canvas>

<div class="scale-wrap">
  <div class="scale-inner" id="scaleInner">

    <div class="dashboard">

      <!-- ========== Top Bar ========== -->
      <div class="topbar">
        <div class="breadcrumb">
          <a class="home" href="zbxboard-dashboard-demo.html">
            <span class="home-logo">Z</span>
            <span class="home-text">ZBXBoard</span>
          </a>
          <span class="sep">/</span>
          <a href="#">监控</a>
          <span class="sep">/</span>
          <a href="#">主机管理</a>
          <span class="sep">/</span>
          <span class="current">mysql-master</span>
        </div>
        <div class="host-title">
          <span class="host-name">mysql-master.zbx.local</span>
          <span class="host-ip">10.20.30.41</span>
          <span class="status-badge problem">存在告警 · 3</span>
        </div>
        <div class="topbar-right">
          <div class="clock" id="clock">--:--:--</div>
          <div class="theme-switcher" id="themeSwitcher">
            <div class="theme-dot active" data-color="cyan"   title="青蓝"></div>
            <div class="theme-dot"        data-color="purple" title="紫罗兰"></div>
            <div class="theme-dot"        data-color="green"  title="翡翠绿"></div>
            <div class="theme-dot"        data-color="orange" title="落日橙"></div>
          </div>
          <a class="back-btn" href="zbxboard-dashboard-demo.html">← 返回大屏</a>
        </div>
      </div>

      <!-- ========== KPI Strip ========== -->
      <section class="kpi-strip" id="kpiStrip"></section>

      <!-- ========== Main Area ========== -->
      <section class="main-area">
        <!-- 1: 基础信息 -->

const particleCanvas = document.getElementById('particleCanvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 50;
function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeParticleCanvas);
resizeParticleCanvas();
function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * particleCanvas.width,
      y: Math.random() * particleCanvas.height,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.2 + 0.4,
    });
  }
}
initParticles();
function drawParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  const primary = cssVar('--primary');
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > particleCanvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > particleCanvas.height) p.vy *= -1;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = primary;
    pCtx.globalAlpha = 0.3;
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(drawParticles);
}

const KPIS = [

function renderKPIs() {
  const root = document.getElementById('kpiStrip');
  root.innerHTML = KPIS.map(k => `
    <div class="kpi">
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-body">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value-row">
          <div class="kpi-value" data-key="${k.key}">${k.value.toFixed(k.unit === 'Mbps' ? 0 : 1)}</div>
          <div class="kpi-unit">${k.unit}</div>
        </div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width: ${(k.value / k.max) * 100}%"></div></div>
      </div>
    </div>
  `).join('');
}
renderKPIs();

function updateKpi(key) {
  const k = KPIS.find(x => x.key === key);
  if (!k) return;
  // 范围
  const ranges = {
    cpu:  [15, 75], mem: [50, 90], disk: [70, 92], net: [80, 700],
  };
  const [min, max] = ranges[key];
  k.value = clamp(k.value + (Math.random() - 0.5) * 4, min, max);
  const el = document.querySelector(`.kpi-value[data-key="${key}"]`);
  const from = parseFloat(el.textContent);
  const to = k.value;
  const dur = 700;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const cur = from + (to - from) * eased;
    el.textContent = k.unit === 'Mbps' ? cur.toFixed(0) : cur.toFixed(1);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  if (bump) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  const bar = el.parentElement.parentElement.querySelector('.kpi-bar-fill');
  bar.style.width = (k.value / k.max) * 100 + '%';
}
let bump = true;
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
setInterval(() => updateKpi('cpu'),  4000);
setInterval(() => updateKpi('mem'),  4500);

function mkLine(name, data, color, yIndex) {
  return {

    lineStyle: { width: 1.6, color, shadowBlur: 6, shadowColor: color },
    areaStyle: yIndex === 0 ? {

        { offset: 0, color: color + '66' },
        { offset: 1, color: color + '00' },
      ])
    } : undefined,
  };
}

function pushTrend() {

  trendData.net.shift();
  trendChart.setOption({

    series: [

      { data: trendData.mem },
      { data: trendData.disk },
      { data: trendData.net },

}

];

function genSparkData(len, base, amp) {
  return Array.from({length: len}, () => base + (Math.random() - 0.5) * amp);
}

let currentCat = 'all';
let currentSearch = '';
window.sparkCharts = [];

function renderItems() {
  const filtered = ITEMS.filter(it => {
    if (currentCat !== 'all' && it.cat !== currentCat) return false;
    if (currentSearch && !it.name.toLowerCase().includes(currentSearch.toLowerCase()) && !it.key.toLowerCase().includes(currentSearch.toLowerCase())) return false;
    return true;
  });
  const tbody = document.getElementById('itemTbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 30px; color: var(--text-3);">无匹配监控项</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map((it, idx) => `
    <tr data-idx="${idx}">
      <td>
        <div class="item-name">${it.name}</div>
        <div class="item-key">${it.key}</div>
      </td>
      <td class="item-val ${it.level || ''}">${it.val.toFixed(it.unit === 'Mbps' || it.unit === 'GB' || it.unit === 'i/s' || it.unit === 'c/s' || it.unit === 'op' ? 0 : (it.unit === 'ms' ? 1 : 1))} <span class="item-meta">${it.unit}</span></td>
      <td><div class="spark" id="spark-${it.key.replace(/[\[\],\/.]/g, '_')}"></div></td>
      <td class="item-meta">${new Date().toLocaleTimeString('zh-CN', { hour12: false })}</td>
    </tr>
  `).join('');

  // 渲染 sparkline
  window.sparkCharts.forEach(c => c.dispose());
  window.sparkCharts = [];
  filtered.forEach((it) => {
    const id = 'spark-' + it.key.replace(/[\[\],\/.]/g, '_');
    const el = document.getElementById(id);
    if (!el) return;
    const chart = echarts.init(el);
    const data = genSparkData(it.sparkLen, it.val, it.val * 0.15);
    const p = palette();
    const color = it.level === 'warn' ? p.warning : it.level === 'danger' ? p.danger : p.primary;
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 2, right: 2, top: 4, bottom: 4 },
      xAxis: { type: 'category', show: false, data: data.map((_, i) => i) },
      yAxis: { type: 'value', show: false, scale: true },
      tooltip: { show: false },
      series: [{
        type: 'line', smooth: true, symbol: 'none',
        data,
        lineStyle: { width: 1.4, color },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: color + '88' },
            { offset: 1, color: color + '00' },
          ])
        },
      }],
    });
    window.sparkCharts.push(chart);
  });
}
renderItems();

document.querySelectorAll('#itemTabs .tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#itemTabs .tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentCat = b.dataset.cat;
    renderItems();
  });
});
document.getElementById('itemSearch').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  renderItems();
});

/* ============================================================
 *  Panel 3D Tilt
 * ============================================================ */
document.querySelectorAll('.panel').forEach(panel => {
  panel.addEventListener('mousemove', (e) => {
    const rect = panel.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (0.5 - y) * 3;
    const ry = (x - 0.5) * 3;
    panel.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(2px)`;
    panel.style.boxShadow = `0 0 18px var(--primary-glow)`;
  });
  panel.addEventListener('mouseleave', () => {
    panel.style.transform = '';
    panel.style.boxShadow = '';
  });
});

/* 窗口缩放图表重排 */
window.addEventListener('resize', () => {
  Object.values(window.echartsInstances || {}).forEach(c => c && c.resize());
  (window.sparkCharts || []).forEach(c => c && c.resize());
});

/* 主题切换重画 */
document.getElementById('themeSwitcher').addEventListener('click', () => {
  setTimeout(() => {
    trendChart.setOption(trendOption(), true);
    renderItems();
  }, 50);
});
</script>

</body>
</html>
