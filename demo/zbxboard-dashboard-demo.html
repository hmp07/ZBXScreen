<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>ZBXBoard · 监控大屏演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============ Design Tokens ============ */
:root {
  --bg-1: #05080f;
  --bg-2: #081628;
  --bg-3: #0d2a4a;
  --panel-bg: rgba(8, 24, 48, 0.55);
  --panel-border: rgba(0, 229, 255, 0.28);
  --primary: #00e5ff;
  --primary-2: #00b8d4;
  --primary-glow: rgba(0, 229, 255, 0.5);
  --success: #52c41a;
  --warning: #faad14;
  --danger: #f5222d;
  --disaster: #820014;
  --info: #1890ff;
  --text-1: #e6f7ff;
  --text-2: #a8c4d8;
  --text-3: #6b89a3;
  --text-4: #455a72;
  --grid: rgba(0, 229, 255, 0.04);
  --font-num: 'Orbitron', 'Share Tech Mono', 'Consolas', monospace;
  --font-cn:  'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-cn);
  color: var(--text-1);
  background: #000;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse at top, rgba(0, 229, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(123, 97, 255, 0.05), transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
  mix-blend-mode: screen;
}
.bg-orb-1 { width: 480px; height: 480px; background: var(--primary); top: -120px; left: -120px; animation: orb-float-1 22s ease-in-out infinite; }
.bg-orb-2 { width: 600px; height: 600px; background: #7b61ff; bottom: -200px; right: -200px; animation: orb-float-2 28s ease-in-out infinite; }
.bg-orb-3 { width: 380px; height: 380px; background: #00ffaa; top: 40%; left: 30%; opacity: 0.18; animation: orb-float-3 32s ease-in-out infinite; }

@keyframes orb-float-1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
@keyframes orb-float-2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-80px, -40px); } }
@keyframes orb-float-3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, -60px); } }

#particleCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

#matrixCanvas {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.18;
}

#flylineCanvasL, #flylineCanvasR {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* ============ Layout (1920×1080) ============ */
.scale-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
.scale-inner {
  transform-origin: center center;
  position: relative;
}

.dashboard {
  position: relative;
  width: 1920px;
  height: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 80px 110px 1fr 240px;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px 16px;
  z-index: 1;
}

/* ============ Header ============ */
.header {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 24px;
  background: linear-gradient(180deg, rgba(0, 229, 255, 0.05), transparent);
  overflow: hidden;
}
.header::before, .header::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary) 50%, transparent);
  opacity: 0.6;
}
.header::before { top: 0; }
.header::after  { bottom: 0; }

.matrix-rain {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 2;
}
.brand-logo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-num);
  font-weight: 900;
  color: #001a2b;
  font-size: 20px;
  box-shadow: 0 0 24px var(--primary-glow), inset 0 0 12px rgba(255,255,255,0.3);
  position: relative;
}
.brand-logo::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 12px;
  border: 1px solid var(--primary);
  opacity: 0.5;
  animation: logo-pulse 2s ease-in-out infinite;
}
@keyframes logo-pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.08); opacity: 0.9; }
}
.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.brand-name {
  font-family: var(--font-num);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--primary), #7be8ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-sub {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 4px;
}

.title-wrap {
  position: relative;
  text-align: center;
  z-index: 2;
}
.title-main {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 10px;
  background: linear-gradient(180deg, #ffffff 30%, var(--primary) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 24px var(--primary-glow);
  padding: 0 10px;
}
.title-deco {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 420px;
  height: 64px;
  border: 1px solid var(--panel-border);
  border-radius: 0;
  pointer-events: none;
}
.title-deco::before, .title-deco::after {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2px solid var(--primary);
}
.title-deco::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.title-deco::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.title-wing-l, .title-wing-r {
  position: absolute;
  top: 50%;
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary));
}
.title-wing-l { left: -200px; }
.title-wing-r { right: -200px; transform: scaleX(-1); }

.header-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 18px;
  z-index: 2;
}
.clock-block {
  text-align: right;
  position: relative;
}
.clock {
  font-family: var(--font-num);
  font-size: 30px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 3px;
  text-shadow: 0 0 16px var(--primary-glow);
  line-height: 1;
}
.clock::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 28px;
  background: var(--primary);
  margin-left: 4px;
  vertical-align: middle;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.clock-date {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 2px;
  margin-top: 4px;
}
.theme-switcher {
  display: flex;
  gap: 8px;
  padding: 4px 8px;
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  background: rgba(0, 229, 255, 0.04);
}
.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.25s;
}
.theme-dot:hover { transform: scale(1.2); }
.theme-dot.active { border-color: #fff; box-shadow: 0 0 12px currentColor; }
.theme-dot[data-color="cyan"]    { background: #00e5ff; color: #00e5ff; }
.theme-dot[data-color="purple"]  { background: #7b61ff; color: #7b61ff; }
.theme-dot[data-color="green"]   { background: #52c41a; color: #52c41a; }
.theme-dot[data-color="orange"]  { background: #ff7a45; color: #ff7a45; }

/* ============ KPI Strip ============ */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  padding: 0 6px;
}
.kpi {
  position: relative;
  height: 100%;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 18px;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  will-change: transform;
}
.kpi::before, .kpi::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border: 2px solid var(--primary);
  opacity: 0.8;
}
.kpi::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.kpi::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 24px var(--primary-glow);
}
.kpi-glow {
  position: absolute;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--primary-glow), transparent 70%);
  right: -60px;
  top: -60px;
  opacity: 0.3;
  pointer-events: none;
}
.kpi-icon {
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(0, 229, 255, 0.04));
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  flex-shrink: 0;
  position: relative;
}
.kpi-icon::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), transparent);
  opacity: 0.3;
  z-index: -1;
  filter: blur(6px);
}
.kpi-body { flex: 1; min-width: 0; }
.kpi-label {
  font-size: 13px;
  color: var(--text-2);
  letter-spacing: 2px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 10px;
  background: var(--primary);
}
.kpi-value-row { display: flex; align-items: baseline; gap: 6px; }
.kpi-value {
  font-family: var(--font-num);
  font-size: 40px;
  font-weight: 900;
  color: var(--primary);
  line-height: 1;
  text-shadow: 0 0 18px var(--primary-glow);
  font-variant-numeric: tabular-nums;
  transition: text-shadow 0.3s;
}
.kpi-value.bump { animation: bump 0.4s ease; }
@keyframes bump {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); text-shadow: 0 0 30px var(--primary); }
}
.kpi-unit { font-size: 14px; color: var(--text-3); }
.kpi-delta {
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
  font-family: var(--font-num);
}
.kpi-delta.up   { color: var(--danger); }
.kpi-delta.down { color: var(--success); }
.kpi-delta.flat { color: var(--text-3); }

/* ============ Panel ============ */
.panel {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 0.15s ease, box-shadow 0.3s;
  will-change: transform;
}
.panel::before, .panel::after,
.panel > .corner-tl, .panel > .corner-tr,
.panel > .corner-bl, .panel > .corner-br {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border: 2px solid var(--primary);
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  animation: corner-draw 1.2s ease-out forwards;
}
.panel::before { top: -2px;    left: -2px;   border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel::after  { bottom: -2px; right: -2px;  border-left: 0;  border-top: 0;    animation-delay: 0.35s; }
.panel > .corner-tl { top: -2px;    left: -2px;   border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel > .corner-tr { top: -2px;    right: -2px;  border-left: 0;  border-bottom: 0; animation-delay: 0.15s; }
.panel > .corner-bl { bottom: -2px; left: -2px;   border-right: 0; border-top: 0;    animation-delay: 0.25s; }
@keyframes corner-draw {
  0% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
  100% { opacity: 0.8; transform: scale(1); }
}

.panel-title {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  background: linear-gradient(90deg, rgba(0, 229, 255, 0.12), transparent);
  flex-shrink: 0;
}
.panel-title-text {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-title-text::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 14px;
  background: linear-gradient(180deg, var(--primary), transparent);
}
.panel-title-en {
  font-size: 11px;
  color: var(--text-4);
  font-family: var(--font-num);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-left: 6px;
}
.panel-title-tools {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-3);
  align-items: center;
}
.panel-title-tools span.live::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
  margin-right: 5px;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 8px var(--success);
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--success); }
  50% { opacity: 0.5; box-shadow: 0 0 0 6px transparent; }
}

.panel-body {
  flex: 1;
  position: relative;
  padding: 8px 4px 4px;
  min-height: 0;
}
.panel-body.no-pad { padding: 0; }

/* ============ Main Area (3 cols, each col has 2 stacked panels) ============ */
.main-area {
  display: grid;
  grid-template-columns: 3fr 5fr 3fr;
  gap: 12px;
  min-height: 0;
}
.col-stack {
  position: relative;
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  min-height: 0;
}
.col-stack > .panel { min-height: 0; }

/* ============ Alert Bar (bottom) ============ */
.alert-bar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  min-height: 0;
}

/* ============ Alert List ============ */
.alert-list { height: 100%; display: flex; flex-direction: column; }
.alert-list-header, .alert-row {
  display: grid;
  grid-template-columns: 100px 60px 1fr 90px;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
}
.alert-list-header {
  height: 30px;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 1px;
  border-bottom: 1px solid rgba(0, 229, 255, 0.1);
  background: rgba(0, 229, 255, 0.04);
  flex-shrink: 0;
}
.alert-list-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.alert-list-inner {
  position: absolute;
  inset: 0;
  padding: 6px 0;
  transition: transform 0.6s ease;
}
.alert-row {
  height: 36px;
  font-size: 13px;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.08);
  transition: background 0.2s;
}
.alert-row:hover { background: rgba(0, 229, 255, 0.06); }
.alert-row.new {
  background: linear-gradient(90deg, rgba(245, 34, 45, 0.25), transparent);
  animation: flash 2s ease-out;
}
@keyframes flash {
  0% { background: rgba(245, 34, 45, 0.6); }
  100% { background: transparent; }
}
.alert-time { font-family: var(--font-num); color: var(--text-2); font-size: 12px; }
.alert-sev {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
  border-radius: 2px;
  padding: 0 6px;
}
.alert-sev.disaster { background: var(--disaster); }
.alert-sev.high     { background: var(--danger); }
.alert-sev.average  { background: var(--warning); color: #2b1d00; }
.alert-sev.warning  { background: #fa8c16; }
.alert-sev.info     { background: var(--info); }
.alert-sev.not_classified { background: var(--text-3); }
.alert-host {
  color: var(--primary);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.alert-msg {
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
}
.alert-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2px;
  text-align: center;
}
.alert-status.problem { color: var(--danger); border: 1px solid var(--danger); }
.alert-status.ack     { color: var(--warning); border: 1px solid var(--warning); }
.alert-status.ok      { color: var(--success); border: 1px solid var(--success); }

/* ============ TOP 排行榜 (CPU/Mem/Tx/Rx) ============ */
.top-list {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 6px 10px 8px;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
.top-item {
  position: relative;
  height: 44px;
  display: grid;
  grid-template-columns: 32px 1fr 80px;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  background: linear-gradient(90deg, rgba(0, 229, 255, 0.06), rgba(0, 229, 255, 0.02));
  border: 1px solid rgba(0, 229, 255, 0.12);
  border-left: 3px solid var(--primary);
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s, box-shadow 0.3s;
  will-change: transform;
}
.top-item.up {
  border-left-color: var(--danger);
  animation: rank-up 0.8s ease;
}
.top-item.down {
  border-left-color: var(--success);
  animation: rank-down 0.8s ease;
}
@keyframes rank-up {
  0% { box-shadow: 0 0 0 0 var(--danger); }
  50% { box-shadow: 0 0 20px var(--danger); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@keyframes rank-down {
  0% { box-shadow: 0 0 0 0 var(--success); }
  50% { box-shadow: 0 0 20px var(--success); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.top-rank {
  font-family: var(--font-num);
  font-size: 22px;
  font-weight: 900;
  color: var(--primary);
  text-align: center;
  text-shadow: 0 0 10px var(--primary-glow);
}
.top-rank.r1 { color: #ff6b35; text-shadow: 0 0 14px rgba(255, 107, 53, 0.6); }
.top-rank.r2 { color: #ffc53d; text-shadow: 0 0 14px rgba(255, 197, 61, 0.6); }
.top-rank.r3 { color: #73d13d; text-shadow: 0 0 14px rgba(115, 209, 61, 0.5); }

.top-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.top-host {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}
.top-host .arrow {
  font-family: var(--font-num);
  font-size: 10px;
  font-weight: 700;
}
.top-host .arrow.up   { color: var(--danger); }
.top-host .arrow.down { color: var(--success); }
.top-host .arrow.flat { color: var(--text-3); }

.top-bar {
  position: relative;
  height: 5px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 3px;
  overflow: hidden;
}
.top-bar-fill {
  position: absolute;
  inset: 0;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 0 8px var(--primary-glow);
}
.top-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);

<script>
/* ============================================================
 *  ZBXBoard · 监控大屏演示 v3.0
 *  - 布局重构：3 栏每栏上下两块，告警独立底部
 *  - 左栏：CPU TOP5 / 内存 TOP5（含飞线）
 *  - 中栏：资源时序 / 主机状态
 *  - 右栏：发送流量 TOP5 / 接收流量 TOP5（含飞线）
 *  - 酷炫增强保留：粒子 / 矩阵雨 / 浮动光斑 / 3D tilt / 入场描边 / 扫描线 / KPI bump / 告警音效
 * ============================================================ */

/* ---------- 自适应缩放 ---------- */
function fitScale() {
  const wrap = document.querySelector('.scale-wrap');
  const inner = document.getElementById('scaleInner');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const scale = Math.min(w / 1920, h / 1080);
  inner.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitScale);
fitScale();

/* ---------- 时钟 ---------- */
const $clock = document.getElementById('clock');
const $clockDate = document.getElementById('clockDate');
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
function pad(n) { return String(n).padStart(2, '0'); }
function tickClock() {
  const d = new Date();
  $clock.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $clockDate.textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${WEEK_CN[d.getDay()]}`;
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- 主题色切换 ---------- */
document.querySelectorAll('.theme-dot').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.theme-dot').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.body.dataset.theme = el.dataset.color;
    if (window.echartsInstances) {
      Object.values(window.echartsInstances).forEach(c => {
        const opt = c.getOption();
        if (opt) c.setOption(opt, { notMerge: false });
      });
    }
  });
});

function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function palette() {
  return {
    primary: cssVar('--primary'),
    primary2: cssVar('--primary-2'),
    success: cssVar('--success'),
    warning: cssVar('--warning'),
    danger: cssVar('--danger'),
    info: cssVar('--info'),
    text1: cssVar('--text-1'),
    text2: cssVar('--text-2'),
    text3: cssVar('--text-3'),
    text4: cssVar('--text-4'),
  };
}

/* ============================================================
 *  Mock 数据
 * ============================================================ */

const KPIS_INIT = [
  { key: 'hosts',   label: '在线主机',  unit: '台',  icon: '🖥️',  value: 1248, delta: +12,  trend: 'up' },
  { key: 'alerts',  label: '告警总数',  unit: '条',  icon: '🚨',  value: 37,   delta: +5,   trend: 'up' },
  { key: 'cpu',     label: 'CPU  均值', unit: '%',   icon: '⚙️',  value: 42.7, delta: -1.3, trend: 'down' },
  { key: 'memory',  label: '内存均值',  unit: '%',   icon: '💾',  value: 68.3, delta: +0.7, trend: 'up' },
  { key: 'recov',   label: '今日恢复',  unit: '条',  icon: '✅',  value: 24,   delta: +8,   trend: 'up' },
];

const HOST_POOL = [
  'web-prod-01','web-prod-02','web-prod-03','api-gw-01','api-gw-02',
  'mysql-master','mysql-slave-01','redis-01','redis-02','kafka-01',
  'k8s-node-01','k8s-node-02','k8s-node-03','nginx-01','nginx-02',
  'mongo-01','es-master','es-data-01','es-data-02','prometheus',
  'order-svc-01','pay-svc-01','user-svc-01','search-svc-01','rec-svc-01',
  'cdn-edge-bj','cdn-edge-sh','cdn-edge-gz','cdn-edge-cd','cdn-edge-xa',
  'docker-01','docker-02','logstash-01','jenkins-01','gitlab-01',
];

const TRIGGERS = [
  'CPU 使用率超过阈值', '内存使用率 > 85%', '磁盘空间不足 (< 10%)',
  '网络入流量异常', '磁盘 IO 延迟过高', '服务进程消失',
  '主从同步延迟', 'HTTP 5xx 错误率飙升', '数据库连接数耗尽',
  'SSL 证书 7 天内过期', 'P99 响应时间 > 2s', 'Kafka 消费积压',
  'Docker 容器 OOM', '缓存命中率下降', 'Pod 重启次数过多',
];

const SEVERITIES = [
  { key: 'disaster',      label: '灾难', weight: 1  },
  { key: 'high',          label: '严重', weight: 5  },
  { key: 'average',       label: '一般', weight: 15 },
  { key: 'warning',       label: '警告', weight: 30 },
  { key: 'info',          label: '信息', weight: 30 },
  { key: 'not_classified',label: '未分', weight: 19 },
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function severityByWeight() {
  const total = SEVERITIES.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const s of SEVERITIES) { if (r < s.weight) return s; r -= s.weight; }
  return SEVERITIES[2];
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* ============================================================
 *  KPI 翻牌器
 * ============================================================ */
function renderKPIs() {
  const root = document.getElementById('kpiStrip');
  root.innerHTML = KPIS_INIT.map(k => `
    <div class="kpi">
      <div class="kpi-glow"></div>
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-body">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value-row">
          <div class="kpi-value" data-key="${k.key}">${formatKpi(k.value, k.key)}</div>
          <div class="kpi-unit">${k.unit}</div>
        </div>
        <div class="kpi-delta ${k.trend}" data-delta="${k.key}">
          <span>${k.trend === 'up' ? '▲' : k.trend === 'down' ? '▼' : '—'}</span>
          <span>${Math.abs(k.delta)}${k.key === 'cpu' || k.key === 'memory' ? 'pp' : ''}</span>
          <span style="color: var(--text-3); font-family: var(--font-cn);">较 1h 前</span>
        </div>
      </div>
    </div>
  `).join('');
}
function formatKpi(v, key) {
  if (key === 'cpu' || key === 'memory') return v.toFixed(1);
  return Math.round(v).toLocaleString();
}

function updateKpi(key, value, delta, bump = true) {
  const el = document.querySelector(`.kpi-value[data-key="${key}"]`);
  if (!el) return;
  const from = parseFloat(el.textContent.replace(/,/g, ''));
  const to = value;
  if (Math.abs(from - to) < 0.05) return;
  const dur = 700;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const cur = from + (to - from) * eased;
    el.textContent = key === 'cpu' || key === 'memory' ? cur.toFixed(1) : Math.round(cur).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  if (bump) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  if (delta !== undefined) {
    const d = document.querySelector(`.kpi-delta[data-delta="${key}"]`);
    if (d) {
      const abs = Math.abs(delta);
      d.className = `kpi-delta ${delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat'}`;
      d.innerHTML = `<span>${delta > 0 ? '▲' : delta < 0 ? '▼' : '—'}</span><span>${abs}${key === 'cpu' || key === 'memory' ? 'pp' : ''}</span><span style="color: var(--text-3); font-family: var(--font-cn);">较 1h 前</span>`;
    }
  }
}
renderKPIs();

/* ============================================================
 *  资源实时趋势
 * ============================================================ */
const trendChart = echarts.init(document.getElementById('trendChart'));
window.echartsInstances = { trend: trendChart };

const TREND_LEN = 60;
const trendData = {
  cpu:    Array.from({length: TREND_LEN}, () => 35 + Math.random() * 20),
  memory: Array.from({length: TREND_LEN}, () => 60 + Math.random() * 15),
  disk:   Array.from({length: TREND_LEN}, () => 45 + Math.random() * 10),
  net:    Array.from({length: TREND_LEN}, () => 25 + Math.random() * 35),
};
const trendTime = Array.from({length: TREND_LEN}, (_, i) => {
  const d = new Date(Date.now() - (TREND_LEN - i - 1) * 5000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
});

function trendOption() {
  const p = palette();
  return {
    backgroundColor: 'transparent',
    grid: { left: 50, right: 30, top: 36, bottom: 28 },
    legend: {
      data: ['CPU', '内存', '磁盘', '网络'],
      textStyle: { color: p.text2, fontSize: 11 },
      right: 10, top: 6,
      itemWidth: 14, itemHeight: 8, itemGap: 18,
    },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(8, 24, 48, 0.95)',
      borderColor: p.primary,
      borderWidth: 1,
      textStyle: { color: p.text1, fontSize: 12 },
      axisPointer: { type: 'cross', lineStyle: { color: p.primary, opacity: 0.4 } },
    },
    xAxis: {
      type: 'category',
      data: trendTime,
      boundaryGap: false,
      axisLine: { lineStyle: { color: p.text4 } },
      axisLabel: { color: p.text3, fontSize: 10, interval: 9 },
      splitLine: { show: false },
    },
    yAxis: {
      type: 'value',
      max: 100,
      axisLine: { show: false },
      axisLabel: { color: p.text3, fontSize: 10, formatter: '{value}%' },
      splitLine: { lineStyle: { color: 'rgba(0, 229, 255, 0.08)' } },
    },
    series: [
      mkLine('CPU',   trendData.cpu,    p.primary,  p),
      mkLine('内存',  trendData.memory, p.success,  p),
      mkLine('磁盘',  trendData.disk,   p.warning,  p),
      mkLine('网络',  trendData.net,    '#7b61ff',  p),
    ]
  };
}
function mkLine(name, data, color, p) {
  return {
    name, type: 'line', smooth: true, symbol: 'none',
    data,
    lineStyle: { width: 1.6, color, shadowBlur: 8, shadowColor: color },
    areaStyle: {
      color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: color + 'BB' },
        { offset: 1, color: color + '00' },
      ])
    },
  };
}
trendChart.setOption(trendOption());

function pushTrend() {
  const d = new Date();
  trendTime.push(`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);
  trendTime.shift();
  trendData.cpu.push(clamp(trendData.cpu[trendData.cpu.length-1] + (Math.random()-0.5)*4, 5, 95));
  trendData.cpu.shift();
  trendData.memory.push(clamp(trendData.memory[trendData.memory.length-1] + (Math.random()-0.5)*2, 30, 95));
  trendData.memory.shift();
  trendData.disk.push(clamp(trendData.disk[trendData.disk.length-1] + (Math.random()-0.5)*1, 20, 90));
  trendData.disk.shift();
  trendData.net.push(clamp(trendData.net[trendData.net.length-1] + (Math.random()-0.5)*8, 5, 90));
  trendData.net.shift();
  trendChart.setOption({
    xAxis: { data: trendTime },
    series: [
      { data: trendData.cpu },
      { data: trendData.memory },
      { data: trendData.disk },
      { data: trendData.net },
    ]
  });
  updateKpi('cpu',    trendData.cpu[trendData.cpu.length-1],    +(trendData.cpu[trendData.cpu.length-1] - trendData.cpu[trendData.cpu.length-2]).toFixed(1));
  updateKpi('memory', trendData.memory[trendData.memory.length-1], +(trendData.memory[trendData.memory.length-1] - trendData.memory[trendData.memory.length-2]).toFixed(1));
}

/* ============================================================
 *  TOP 排行榜（4 个：cpu / mem / tx / rx）
 *  - 用配置驱动
 * ============================================================ */
const TOP_LIST_CONFIG = {
  cpu: { rootId: 'cpuList',  max: 100,  unit: '%',     bigJumpProb: 0.3, bigJump: [10, 20], minMax: [5, 99]  },
  mem: { rootId: 'memList',  max: 100,  unit: '%',     bigJumpProb: 0.3, bigJump: [8, 15],  minMax: [10, 99] },
  tx:  { rootId: 'txList',   max: 1000, unit: 'Mbps',  bigJumpProb: 0.3, bigJump: [60, 150],minMax: [50, 980] },
  rx:  { rootId: 'rxList',   max: 1000, unit: 'Mbps',  bigJumpProb: 0.3, bigJump: [60, 150],minMax: [50, 980] },
};

// 12 个主机，每个有 cpu / mem / tx / rx
const topHosts = [];
for (let i = 0; i < 12; i++) {
  topHosts.push({
    host: HOST_POOL[i] + '.zbx',
    cpu: 40 + Math.random() * 50,
    mem: 40 + Math.random() * 50,
    tx:  100 + Math.random() * 700,
    rx:  100 + Math.random() * 700,
  });
}

function rankItems(type) {
  return [...topHosts].sort((a, b) => b[type] - a[type]).map((x, i) => ({ ...x, rank: i + 1 }));
}

function renderTopList(type) {
  const cfg = TOP_LIST_CONFIG[type];
  const items = rankItems(type).slice(0, 5);
  const root = document.getElementById(cfg.rootId);
  const html = items.map(it => {
    const prevKey = `prev_${type}`;
    const prev = it[prevKey] !== undefined ? it[prevKey] : it.rank;
    const arrowCls = prev > it.rank ? 'up' : prev < it.rank ? 'down' : 'flat';
    const arrowSym = arrowCls === 'up' ? '↑' : arrowCls === 'down' ? '↓' : '−';
    const arrowDelta = Math.abs(prev - it.rank);
    const barPct = (it[type] / cfg.max) * 100;
    const valStr = type === 'tx' || type === 'rx' ? it[type].toFixed(0) : it[type].toFixed(1);
    return `
      <div class="top-item" data-host="${it.host}">
        <div class="top-rank r${it.rank}">${it.rank}</div>
        <div class="top-info">
          <div class="top-host">
            ${it.host}
            <span class="arrow ${arrowCls}">${arrowSym}${arrowDelta || ''}</span>
          </div>
          <div class="top-bar"><div class="top-bar-fill" style="width: ${barPct.toFixed(1)}%"></div></div>
        </div>
        <div class="top-value">
          <span class="top-value-num">${valStr}</span><span class="top-value-unit">${cfg.unit}</span>
        </div>
      </div>
    `;
  }).join('');

  // FLIP
  const oldRects = new Map();
  root.querySelectorAll('.top-item').forEach(el => {
    oldRects.set(el.dataset.host, el.getBoundingClientRect());
  });
  root.innerHTML = html;
  root.querySelectorAll('.top-item').forEach(el => {
    const old = oldRects.get(el.dataset.host);
    if (old) {
      const cur = el.getBoundingClientRect();
      const dy = old.top - cur.top;
      if (Math.abs(dy) > 0.5) {
        el.style.transition = 'none';
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s, box-shadow 0.3s';
          el.style.transform = '';
        });
      }
    }
  });

  // 排名变化特效
  root.querySelectorAll('.top-item').forEach(el => {
    const host = el.dataset.host;
    const it = items.find(x => x.host === host);
    if (it && it[prevKey] !== undefined) {
      if (it[prevKey] > it.rank) {
        el.classList.add('up');
        setTimeout(() => el.classList.remove('up'), 900);
      } else if (it[prevKey] < it.rank) {
        el.classList.add('down');
        setTimeout(() => el.classList.remove('down'), 900);
      }
    }
  });

  // 记录当前排名
  items.forEach(it => {
    const h = topHosts.find(x => x.host === it.host);
    if (h) h[prevKey] = it.rank;
  });

  // 触发飞线
  if (window.redrawFlyline) window.redrawFlyline(type);
}

function updateTopList(type) {
  const cfg = TOP_LIST_CONFIG[type];
  const [jMin, jMax] = cfg.bigJump;
  const [vMin, vMax] = cfg.minMax;
  const step = type === 'tx' || type === 'rx' ? 30 : type === 'cpu' ? 8 : 5;
  topHosts.forEach(h => {
    h[type] = clamp(h[type] + (Math.random() - 0.5) * step, vMin, vMax);
  });
  if (Math.random() < cfg.bigJumpProb) {
    const idx = randInt(0, topHosts.length - 1);
    topHosts[idx][type] = clamp(topHosts[idx][type] + (Math.random() > 0.5 ? 1 : -1) * randInt(jMin, jMax), vMin, vMax);
  }
  renderTopList(type);
}

['cpu', 'mem', 'tx', 'rx'].forEach(t => renderTopList(t));

/* ============================================================
 *  告警滚动列表（底部横栏）
 * ============================================================ */
const ALERTS = [];
function genAlert(initial = false) {
  const sev = severityByWeight();
  const now = new Date();
  const host = pick(HOST_POOL) + '.zbx';
  const trigger = pick(TRIGGERS);
  const statuses = ['problem', 'problem', 'problem', 'ack', 'ok'];
  const status = pick(statuses);
  return {
    id: Math.random().toString(36).slice(2),
    time: `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
    sev, host, msg: trigger, status,
    isNew: !initial,
  };
}
for (let i = 0; i < 16; i++) ALERTS.push(genAlert(true));

function renderAlertList() {
  const inner = document.getElementById('alertListInner');
  const sevMap = { disaster: '灾难', high: '严重', average: '一般', warning: '警告', info: '信息', not_classified: '未分' };
  const statusMap = { problem: '告警', ack: '已确认', ok: '已恢复' };
  inner.innerHTML = ALERTS.map(a => `
    <div class="alert-row ${a.isNew ? 'new' : ''}">
      <div class="alert-time">${a.time}</div>
      <div><span class="alert-sev ${a.sev.key}">${sevMap[a.sev.key]}</span></div>
      <div>
        <div class="alert-host">${a.host}</div>
        <div class="alert-msg">${a.msg}</div>
      </div>
      <div style="text-align:center;">
        <span class="alert-status ${a.status}">${statusMap[a.status]}</span>
      </div>
    </div>
  `).join('');
  ALERTS.forEach(a => a.isNew = false);
  startAlertScroll();
}
let scrollTimer = null;
function startAlertScroll() {
  if (scrollTimer) clearInterval(scrollTimer);
  const inner = document.getElementById('alertListInner');
  const body = document.querySelector('.alert-list-body');
  const rowH = 42;
  let offset = 0;
  scrollTimer = setInterval(() => {
    offset += rowH;
    const maxOffset = Math.max(0, inner.scrollHeight - body.clientHeight);
    if (offset >= maxOffset) offset = 0;
    inner.style.transform = `translateY(-${offset}px)`;
  }, 2500);
}
function addAlert() {
  const a = genAlert();
  ALERTS.unshift(a);
  if (ALERTS.length > 30) ALERTS.length = 30;
  renderAlertList();
  playAlertBeep(a.sev.key);
  const problemCount = ALERTS.filter(x => x.status === 'problem' || x.status === 'ack').length;
  updateKpi('alerts', problemCount, Math.random() > 0.5 ? +1 : -1);
}
renderAlertList();

/* ============================================================
 *  主机状态
 * ============================================================ */
const statusChart = echarts.init(document.getElementById('statusChart'));
window.echartsInstances.status = statusChart;

function statusOption(problem, offline) {
  const p = palette();
  return {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(8, 24, 48, 0.95)',
      borderColor: p.primary,
      textStyle: { color: p.text1, fontSize: 12 },
      formatter: '{b}: {c} ({d}%)',
    },
    graphic: [
      {
        type: 'text',
        left: 'center',
        top: '38%',
        style: { text: 1248, fill: p.text1, fontSize: 32, fontWeight: 900, fontFamily: 'Orbitron, monospace', textAlign: 'center' },
      },
      {
        type: 'text',
        left: 'center',
        top: '60%',
        style: { text: '总主机', fill: p.text3, fontSize: 12, textAlign: 'center' },
      },
    ],
    series: [{
      type: 'pie',
      radius: ['52%', '76%'],
      center: ['50%', '50%'],
      avoidLabelOverlap: false,
      label: { show: true, position: 'outside', color: p.text2, fontSize: 11, formatter: '{b}\n{c}' },
      labelLine: { length: 6, length2: 6, lineStyle: { color: p.text4 } },
      itemStyle: { borderColor: '#050d1a', borderWidth: 2 },
      data: [
        { name: '健康', value: Math.max(0, 1248 - problem - offline), itemStyle: { color: p.success } },
        { name: '告警', value: problem, itemStyle: { color: p.danger } },
        { name: '离线', value: offline, itemStyle: { color: p.text3 } },
      ],
    }]
  };
}
statusChart.setOption(statusOption(37, 66));

/* ============================================================
 *  粒子背景
 * ============================================================ */
const particleCanvas = document.getElementById('particleCanvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 80;

function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeParticleCanvas);
resizeParticleCanvas();

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * particleCanvas.width,
      y: Math.random() * particleCanvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.5,
    });
  }
}
initParticles();

function drawParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  const primary = cssVar('--primary');
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > particleCanvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > particleCanvas.height) p.vy *= -1;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = primary;
    pCtx.globalAlpha = 0.5;
    pCtx.fill();
    for (let j = i + 1; j < particles.length; j++) {
      const q = particles[j];
      const dx = p.x - q.x, dy = p.y - q.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < 120) {
        pCtx.beginPath();
        pCtx.moveTo(p.x, p.y);
        pCtx.lineTo(q.x, q.y);
        pCtx.strokeStyle = primary;
        pCtx.globalAlpha = (1 - d / 120) * 0.3;
        pCtx.lineWidth = 0.5;
        pCtx.stroke();
      }
    }
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ============================================================
 *  顶部矩阵雨
 * ============================================================ */
const matrixCanvas = document.getElementById('matrixCanvas');
const mCtx = matrixCanvas.getContext('2d');
const MATRIX_CHARS = '01ABCDEFGHJKLMNPQRSTUVWXYZ#$%&*+-/<>=?@';
let matrixDrops = [];
let matrixFontSize = 14;

function resizeMatrix() {
  const header = document.querySelector('.header');
  const rect = header.getBoundingClientRect();
  matrixCanvas.width = rect.width;
  matrixCanvas.height = rect.height;
  const cols = Math.floor(matrixCanvas.width / matrixFontSize);
  matrixDrops = Array.from({ length: cols }, () => Math.random() * -100);
}
window.addEventListener('resize', resizeMatrix);
setTimeout(resizeMatrix, 100);

function drawMatrix() {
  mCtx.fillStyle = 'rgba(5, 8, 15, 0.08)';
  mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
  mCtx.fillStyle = cssVar('--primary');
  mCtx.font = `${matrixFontSize}px 'Share Tech Mono', monospace`;
  for (let i = 0; i < matrixDrops.length; i++) {
    const text = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
    mCtx.fillStyle = `rgba(0, 229, 255, ${0.3 + Math.random() * 0.3})`;
    mCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
    if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
      matrixDrops[i] = 0;
    }
    matrixDrops[i]++;
  }
}
setInterval(drawMatrix, 60);

/* ============================================================
 *  飞线（左栏：CPU/Mem；右栏：TX/RX）
 * ============================================================ */
const flyL = document.getElementById('flylineCanvasL');
const flyR = document.getElementById('flylineCanvasR');
const fCtxL = flyL.getContext('2d');
const fCtxR = flyR.getContext('2d');
let flyParticlesL = [];
let flyParticlesR = [];

function resizeFly() {
  for (const [col, canvas] of [[document.getElementById('leftCol'), flyL], [document.getElementById('rightCol'), flyR]]) {
    const r = col.getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
  }
}
function getItemCenters(rootId, colId) {
  const root = document.getElementById(rootId);
  const col = document.getElementById(colId);
  const colRect = col.getBoundingClientRect();
  return Array.from(root.querySelectorAll('.top-item')).map(el => {
    const r = el.getBoundingClientRect();
    return {
      x: r.left + r.width * 0.5 - colRect.left,
      y: r.top + r.height * 0.5 - colRect.top,
    };
  });
}

window.addEventListener('resize', resizeFly);
setTimeout(resizeFly, 200);

function drawFlyLines(ctx, points, color) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const pt = points[i];
    if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function spawnFlyParticles(points, color, store) {
  if (points.length < 2 || Math.random() > 0.3) return;
  let a = points[randInt(0, points.length-1)];
  let b = points[randInt(0, points.length-1)];
  let tries = 0;
  while (a === b && tries < 3) { b = points[randInt(0, points.length-1)]; tries++; }
  if (a === b) return;
  store.push({
    x: a.x, y: a.y, tx: b.x, ty: b.y, color, life: randInt(60, 120),
  });
}

function redrawFlyline(triggerType) {
  // 左栏：cpu + mem
  fCtxL.clearRect(0, 0, flyL.width, flyL.height);
  const cpu = getItemCenters('cpuList', 'leftCol');
  const mem = getItemCenters('memList', 'leftCol');
  drawFlyLines(fCtxL, cpu, cssVar('--primary'));
  drawFlyLines(fCtxL, mem, cssVar('--primary'));
  spawnFlyParticles(cpu, cssVar('--primary'), flyParticlesL);
  spawnFlyParticles(mem, cssVar('--primary'), flyParticlesL);

  // 右栏：tx + rx
  fCtxR.clearRect(0, 0, flyR.width, flyR.height);
  const tx = getItemCenters('txList', 'rightCol');
  const rx = getItemCenters('rxList', 'rightCol');
  drawFlyLines(fCtxR, tx, cssVar('--primary'));
  drawFlyLines(fCtxR, rx, cssVar('--primary'));
  spawnFlyParticles(tx, cssVar('--primary'), flyParticlesR);
  spawnFlyParticles(rx, cssVar('--primary'), flyParticlesR);
}
window.redrawFlyline = redrawFlyline;

function tickFly() {
  for (const [ctx, store, canvas] of [[fCtxL, flyParticlesL, flyL], [fCtxR, flyParticlesR, flyR]]) {
    if (!canvas.width) continue;
    for (let i = store.length - 1; i >= 0; i--) {
      const p = store[i];
      p.x += (p.tx - p.x) * 0.04;
      p.y += (p.ty - p.y) * 0.04;
      p.life--;
      if (p.life <= 0) store.splice(i, 1);
    }
    for (const p of store) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = p.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  requestAnimationFrame(tickFly);
}
tickFly();

/* ============================================================
 *  告警音效
 * ============================================================ */
let audioCtx = null;
function playAlertBeep(severity) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    const freqs = { disaster: 880, high: 740, average: 587, warning: 440, info: 330, not_classified: 220 };
    o.frequency.value = freqs[severity] || 440;
    o.type = 'sine';
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start();
    o.stop(audioCtx.currentTime + 0.3);
  } catch (e) { /* ignore */ }
}

/* ============================================================
 *  Panel 3D Tilt
 * ============================================================ */
document.querySelectorAll('.panel').forEach(panel => {
  panel.addEventListener('mousemove', (e) => {
    const rect = panel.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (0.5 - y) * 4;
    const ry = (x - 0.5) * 4;
    panel.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(4px)`;
    panel.style.boxShadow = `0 0 24px var(--primary-glow)`;
  });
  panel.addEventListener('mouseleave', () => {
    panel.style.transform = '';
    panel.style.boxShadow = '';
  });
});

/* ============================================================
 *  定时刷新
 * ============================================================ */
setInterval(pushTrend, 5000);
setInterval(addAlert, 8000);
setInterval(() => updateTopList('cpu'), 3000);
setInterval(() => updateTopList('mem'), 3500);
setInterval(() => updateTopList('tx'),  3000);
setInterval(() => updateTopList('rx'),  3300);

setInterval(() => {
  const problem = clamp(37 + randInt(-3, 3), 20, 60);
  const offline = clamp(66 + randInt(-2, 2), 50, 80);
  statusChart.setOption(statusOption(problem, offline));
  updateKpi('hosts', clamp(1248 + randInt(-3, 3), 1200, 1300), 0);
}, 20000);

setInterval(() => {
  updateKpi('recov', Math.round(1200 + Math.random() * 30), randInt(-1, 3));
}, 60000);

window.addEventListener('resize', () => {
  Object.values(window.echartsInstances).forEach(c => c && c.resize());
  resizeFly();
  setTimeout(redrawFlyline, 100);
});

document.getElementById('themeSwitcher').addEventListener('click', () => {
  setTimeout(() => {
    trendChart.setOption(trendOption(), true);
    statusChart.setOption(statusOption(37, 66), true);
  }, 50);
});
</script>
