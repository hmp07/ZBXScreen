<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>ZBXBoard · 告警详情演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============ Design Tokens ============ */
:root {
  --bg-1: #05080f;
  --bg-2: #081628;
  --bg-3: #0d2a4a;
  --panel-bg: rgba(8, 24, 48, 0.6);
  --panel-border: rgba(0, 229, 255, 0.24);
  --primary: #00e5ff;
  --primary-2: #00b8d4;
  --primary-glow: rgba(0, 229, 255, 0.4);
  --success: #52c41a;
  --warning: #faad14;
  --danger: #f5222d;
  --disaster: #820014;
  --info: #1890ff;
  --text-1: #e6f7ff;
  --text-2: #a8c4d8;
  --text-3: #6b89a3;
  --text-4: #455a72;
  --grid: rgba(0, 229, 255, 0.04);
  --font-num: 'Orbitron', 'Share Tech Mono', 'Consolas', monospace;
  --font-cn:  'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sev-color: var(--danger);
  --sev-glow: rgba(245, 34, 45, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-cn);
  color: var(--text-1);
  background: #000;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(ellipse at top, var(--sev-glow) 0%, transparent 50%),
    radial-gradient(ellipse at bottom, rgba(0, 229, 255, 0.04), transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

#particleCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0, 229, 255, 0.04); }
::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.4); }

/* ============ Layout ============ */
.scale-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
.scale-inner {
  transform-origin: center center;
  position: relative;
}

.dashboard {
  position: relative;
  width: 1920px;
  height: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 64px 90px 1fr;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px 16px;
  z-index: 1;
}

/* ============ Top Bar ============ */
.topbar {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  overflow: hidden;
}
.topbar::before, .topbar::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sev-color) 50%, transparent);
  opacity: 0.5;
}
.topbar::before { top: 0; }
.topbar::after  { bottom: 0; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-3);
}
.breadcrumb a {
  color: var(--text-2);
  text-decoration: none;
  transition: color 0.2s;
}
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb .sep { color: var(--text-4); }
.breadcrumb .current { color: var(--sev-color); font-weight: 500; }
.breadcrumb .home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  transition: color 0.2s;
  cursor: pointer;
}
.breadcrumb .home:hover { color: var(--primary); }
.home-logo {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-num);
  font-weight: 900; color: #001a2b; font-size: 14px;
  box-shadow: 0 0 12px var(--primary-glow);
}
.home-text {
  font-family: var(--font-num);
  font-weight: 700;
  letter-spacing: 1.5px;
}

.alert-title-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  min-width: 0;
}
.alert-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 700px;
}
.sev-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
  border-radius: 3px;
  letter-spacing: 1.5px;
  background: var(--sev-color);
  color: #fff;
  box-shadow: 0 0 12px var(--sev-glow);
  position: relative;
}
.sev-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: badge-pulse 1.2s infinite;
}
@keyframes badge-pulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 #fff; }
  50% { opacity: 0.6; transform: scale(0.85); box-shadow: 0 0 0 4px transparent; }
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 3px;
  background: rgba(245, 34, 45, 0.12);
  border: 1px solid var(--danger);
  color: var(--danger);
  font-family: var(--font-num);
}
.status-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  animation: badge-pulse 1.5s infinite;
}
.status-pill.ack     { background: rgba(250, 173, 20, 0.12); border-color: var(--warning); color: var(--warning); }
.status-pill.resolved{ background: rgba(82, 196, 26, 0.12);  border-color: var(--success); color: var(--success); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  background: rgba(0, 229, 255, 0.06);
  border: 1px solid var(--panel-border);
  color: var(--text-1);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-cn);
  text-decoration: none;
  border-radius: 2px;
}
.action-btn:hover {
  background: rgba(0, 229, 255, 0.15);
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
}
.action-btn.primary {
  background: rgba(0, 229, 255, 0.18);
  border-color: var(--primary);
  color: var(--primary);
}
.action-btn.primary:hover {
  background: rgba(0, 229, 255, 0.3);
  box-shadow: 0 0 12px var(--primary-glow);
}
.action-btn.warn {
  background: rgba(250, 173, 20, 0.1);
  border-color: var(--warning);
  color: var(--warning);
}
.action-btn.warn:hover {
  background: rgba(250, 173, 20, 0.2);
  box-shadow: 0 0 12px rgba(250, 173, 20, 0.4);
}
.action-btn.danger {
  background: rgba(245, 34, 45, 0.1);
  border-color: var(--danger);
  color: var(--danger);
}
.action-btn.danger:hover {
  background: rgba(245, 34, 45, 0.2);
  box-shadow: 0 0 12px rgba(245, 34, 45, 0.4);
}

.clock {
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 2px;
  text-shadow: 0 0 8px var(--primary-glow);
}
.theme-switcher {
  display: flex;
  gap: 6px;
  padding: 3px 6px;
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  background: rgba(0, 229, 255, 0.04);
}
.theme-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: #fff; box-shadow: 0 0 8px currentColor; }
.theme-dot[data-color="cyan"]    { background: #00e5ff; color: #00e5ff; }
.theme-dot[data-color="purple"]  { background: #7b61ff; color: #7b61ff; }
.theme-dot[data-color="green"]   { background: #52c41a; color: #52c41a; }
.theme-dot[data-color="orange"]  { background: #ff7a45; color: #ff7a45; }

/* ============ KPI Strip (4 metrics) ============ */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 0 6px;
}
.kpi {
  position: relative;
  height: 100%;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  padding: 0 22px;
  gap: 16px;
  overflow: hidden;
}
.kpi::before, .kpi::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border: 2px solid var(--primary);
  opacity: 0.7;
}
.kpi::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.kpi::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.kpi-icon {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.03));
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  position: relative;
}
.kpi.alert .kpi-icon {
  background: linear-gradient(135deg, rgba(245, 34, 45, 0.18), rgba(245, 34, 45, 0.04));
  border-color: rgba(245, 34, 45, 0.3);
}
.kpi-body { min-width: 0; }
.kpi-label {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.kpi-label::before {
  content: '';
  display: inline-block;
  width: 3px; height: 8px;
  background: var(--primary);
}
.kpi.alert .kpi-label::before { background: var(--danger); }
.kpi-value-row { display: flex; align-items: baseline; gap: 6px; }
.kpi-value {
  font-family: var(--font-num);
  font-size: 28px;
  font-weight: 900;
  color: var(--primary);
  line-height: 1;
  text-shadow: 0 0 10px var(--primary-glow);
  font-variant-numeric: tabular-nums;
}
.kpi.alert .kpi-value { color: var(--danger); text-shadow: 0 0 10px var(--sev-glow); }
.kpi-value.tick { animation: tick 1s ease; }
@keyframes tick {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.kpi-unit { font-size: 12px; color: var(--text-3); }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; font-family: var(--font-num); }

/* ============ Panel ============ */
.panel {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.3s;
  transform-style: preserve-3d;
}
.panel::before, .panel::after,
.panel > .corner-tl, .panel > .corner-tr,
.panel > .corner-bl, .panel > .corner-br {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border: 2px solid var(--primary);
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  animation: corner-draw 1.2s ease-out forwards;
}
.panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; animation-delay: 0.35s; }
.panel > .corner-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; animation-delay: 0.05s; }
.panel > .corner-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; animation-delay: 0.15s; }
.panel > .corner-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; animation-delay: 0.25s; }
@keyframes corner-draw {
  0% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
  100% { opacity: 0.8; transform: scale(1); }
}

.panel-title {
  height: 36px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  background: linear-gradient(90deg, rgba(0, 229, 255, 0.1), transparent);
  flex-shrink: 0;
}
.panel-title-text {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title-text::before {
  content: '';
  display: inline-block;
  width: 4px; height: 14px;
  background: linear-gradient(180deg, var(--primary), transparent);
}
.panel-title-en {
  font-size: 11px;
  color: var(--text-4);
  font-family: var(--font-num);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-left: 6px;
}
.panel-body { flex: 1; position: relative; padding: 10px 14px; min-height: 0; overflow: auto; }
.panel-body.no-pad { padding: 0; }

/* ============ Main Layout (2 cols 1fr:2fr) ============ */
.main-area {
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  min-height: 0;
}
.main-area > .panel { min-height: 0; }
.main-area > .panel.col-1 { grid-column: 1; grid-row: 1; }
.main-area > .panel.col-2 { grid-column: 1; grid-row: 2; }
.main-area > .panel.col-3 { grid-column: 2; grid-row: 1; }
.main-area > .panel.col-4 { grid-column: 2; grid-row: 2; }

/* ============ Trigger Info ============ */
.trig-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.trig-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 12px;
  align-items: start;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.08);
}
.trig-row:last-child { border-bottom: 0; }
.trig-label {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 1px;
  padding-top: 2px;
}
.trig-value {
  font-size: 13px;
  color: var(--text-1);
  font-family: var(--font-num);
  word-break: break-all;
}
.trig-value.highlight { color: var(--primary); }
.trig-value.code {
  background: rgba(0, 229, 255, 0.04);
  border: 1px solid rgba(0, 229, 255, 0.15);
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text-2);
  border-radius: 2px;
  white-space: pre-wrap;
  font-family: 'Share Tech Mono', monospace;
}
.trig-value.alert-color { color: var(--danger); font-weight: 700; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  font-size: 11px;
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.3);
  color: var(--primary);
  border-radius: 2px;
  margin: 2px 4px 2px 0;
  font-family: var(--font-num);
}
.tag.danger { color: var(--danger); border-color: rgba(245, 34, 45, 0.4); background: rgba(245, 34, 45, 0.08); }
.tag.warn   { color: var(--warning); border-color: rgba(250, 173, 20, 0.4); background: rgba(250, 173, 20, 0.08); }

/* ============ Timeline ============ */
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: linear-gradient(180deg, var(--sev-color) 0%, var(--primary) 30%, var(--text-4) 100%);
  opacity: 0.4;
}
.tl-item {
  position: relative;
  padding: 8px 0 8px 4px;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.06);
}
.tl-item:last-child { border-bottom: 0; }
.tl-item::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 14px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 2px solid var(--text-4);
  z-index: 1;
}
.tl-item.alert::before {
  background: var(--danger);
  border-color: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  animation: badge-pulse 1.5s infinite;
}
.tl-item.warn::before {
  background: var(--warning);
  border-color: var(--warning);
}
.tl-item.ok::before {
  background: var(--success);
  border-color: var(--success);
}
.tl-item.user::before {
  background: var(--primary);
  border-color: var(--primary);
}
.tl-time {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-num);
  letter-spacing: 0.5px;
}
.tl-content {
  font-size: 12px;
  color: var(--text-1);
  margin-top: 2px;
}
.tl-content strong { color: var(--primary); font-weight: 600; }
.tl-content .note {
  display: inline-block;
  margin-top: 4px;
  padding: 4px 8px;
  font-size: 11px;
  background: rgba(0, 229, 255, 0.04);
  border-left: 2px solid var(--primary);
  color: var(--text-2);
  border-radius: 0 2px 2px 0;
  font-style: italic;
}

/* ============ Webhook Push List ============ */
.wlist { display: flex; flex-direction: column; gap: 8px; }
.wcard {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  background: rgba(0, 229, 255, 0.03);
  border: 1px solid rgba(0, 229, 255, 0.12);
  border-left: 3px solid var(--text-4);
  transition: background 0.2s;
}
.wcard:hover { background: rgba(0, 229, 255, 0.06); }
.wcard.success { border-left-color: var(--success); }
.wcard.failed  { border-left-color: var(--danger); }
.wcard.retry   { border-left-color: var(--warning); }
.wicon {
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.wbody { min-width: 0; }
.wtitle { font-size: 13px; font-weight: 500; color: var(--text-1); margin-bottom: 3px; }
.wurl { font-size: 11px; color: var(--text-3); font-family: var(--font-num); }
.wstatus {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-num);
  font-size: 12px;
}
.wbadge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 2px;
  letter-spacing: 1px;
}
.wbadge.success { color: var(--success); background: rgba(82, 196, 26, 0.12); border: 1px solid var(--success); }
.wbadge.failed  { color: var(--danger);  background: rgba(245, 34, 45, 0.12);  border: 1px solid var(--danger); }
.wbadge.retry   { color: var(--warning); background: rgba(250, 173, 20, 0.12); border: 1px solid var(--warning); }
.wbadge.pending { color: var(--info);    background: rgba(24, 144, 255, 0.12); border: 1px solid var(--info); }
.wbadge.retrying {
  color: var(--warning);
  background: rgba(250, 173, 20, 0.12);
  border: 1px solid var(--warning);
}
.wbadge.retrying::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
  animation: badge-pulse 1s infinite;
}
.wmeta { color: var(--text-3); font-size: 11px; }
.wmeta strong { color: var(--text-2); font-weight: 500; }

/* ============ Similar Alerts Table ============ */
.similar-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.similar-table thead th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text-3);
  font-size: 11px;
  letter-spacing: 1px;
  font-weight: 500;
  border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  background: rgba(0, 229, 255, 0.04);
}
.similar-table tbody td {
  padding: 8px 10px;
  border-bottom: 1px dashed rgba(0, 229, 255, 0.06);
}
.similar-table tbody tr { transition: background 0.2s; cursor: pointer; }
.similar-table tbody tr:hover { background: rgba(0, 229, 255, 0.06); }

/* ============ Comment / Note Box ============ */
.comment-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 14px;
}
.comment-input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px;
  background: rgba(0, 229, 255, 0.04);
  border: 1px solid var(--panel-border);
  border-radius: 2px;

<script>
/* ============================================================
 *  ZBXBoard · 告警详情演示
 *  - 单文件、零构建
 * ============================================================ */

/* ---------- 缩放 ---------- */
function fitScale() {
  const wrap = document.querySelector('.scale-wrap');
  const inner = document.getElementById('scaleInner');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const scale = Math.min(w / 1920, h / 1080);
  inner.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitScale);
fitScale();

/* ---------- 时钟 ---------- */
const $clock = document.getElementById('clock');
function pad(n) { return String(n).padStart(2, '0'); }
function tickClock() {
  const d = new Date();
  $clock.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- 主题切换 ---------- */
document.querySelectorAll('.theme-dot').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.theme-dot').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.body.dataset.theme = el.dataset.color;
    if (window.echartsInstances) {
      Object.values(window.echartsInstances).forEach(c => {
        const opt = c.getOption();
        if (opt) c.setOption(opt, { notMerge: false });
      });
    }
  });
});
function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function palette() {
  return {
    primary: cssVar('--primary'),
    primary2: cssVar('--primary-2'),
    success: cssVar('--success'),
    warning: cssVar('--warning'),
    danger: cssVar('--danger'),
    info: cssVar('--info'),
    text1: cssVar('--text-1'),
    text2: cssVar('--text-2'),
    text3: cssVar('--text-3'),
    text4: cssVar('--text-4'),
    sev: cssVar('--sev-color'),
    sevGlow: cssVar('--sev-glow'),
  };
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* ============================================================
 *  粒子背景（安静版）
 * ============================================================ */
const particleCanvas = document.getElementById('particleCanvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 40;
function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeParticleCanvas);
resizeParticleCanvas();
function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * particleCanvas.width,
      y: Math.random() * particleCanvas.height,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.2 + 0.4,
    });
  }
}
initParticles();
function drawParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  const primary = cssVar('--primary');
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > particleCanvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > particleCanvas.height) p.vy *= -1;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = primary;
    pCtx.globalAlpha = 0.25;
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ============================================================
 *  告警主数据
 * ============================================================ */
const ALERT = {
  eventId: 'evt-5f8d2a3b',
  triggerId: 'trg-mysql-slow-queries',
  title: 'MySQL 慢查询数 > 100 / 秒',
  severity: 'high',
  status: 'PROBLEM',
  host: 'mysql-master.zbx.local',
  hostIp: '10.20.30.41',
  occurredAt: new Date(Date.now() - 47 * 60 * 1000 - 23 * 1000),  // 47m23s 前
  itemKey: 'mysql.queries.slow_ps',
  value: 156,
  unit: '/s',
  threshold: '> 100',
  tags: [
    { k: 'env', v: 'prod', sev: '' },
    { k: 'role', v: 'database', sev: '' },
    { k: 'service', v: 'mysql', sev: '' },
    { k: 'datacenter', v: 'BJ-IDC-2', sev: '' },
    { k: 'tier', v: 'tier1', sev: 'danger' },
  ],
  // 触发器表达式
  expression: `last(/MySQL by ZBX/templates/mysql-slow-queries/mysql.queries.slow_ps) > 100`,
  recovery: `last(/MySQL by ZBX/templates/mysql-slow-queries/mysql.queries.slow_ps) < 50`,
  priority: 'P2',
  history: 5,    // 过去 7 天同触发器告警次数
  acked: true,
  ackedBy: '张运维',
  ackedAt: new Date(Date.now() - 15 * 60 * 1000),
};

/* 严重等级 → 颜色 */
const SEV_INFO = {
  disaster: { label: '灾 难', color: '#820014', glow: 'rgba(130, 0, 20, 0.5)' },
  high:     { label: '严 重', color: '#f5222d', glow: 'rgba(245, 34, 45, 0.4)' },
  average:  { label: '一 般', color: '#faad14', glow: 'rgba(250, 173, 20, 0.4)' },
  warning:  { label: '警 告', color: '#fa8c16', glow: 'rgba(250, 140, 22, 0.4)' },
  info:     { label: '信 息', color: '#1890ff', glow: 'rgba(24, 144, 255, 0.4)' },
};
function applySev() {
  const info = SEV_INFO[ALERT.severity];
  document.body.style.setProperty('--sev-color', info.color);
  document.body.style.setProperty('--sev-glow', info.glow);
  document.getElementById('sevBadge').textContent = info.label;
  document.getElementById('alertTitle').textContent = ALERT.title;
  document.getElementById('bcEventId').textContent = ALERT.eventId;
}
applySev();

/* ============================================================
 *  KPI 4 项
 * ============================================================ */
function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h} 时 ${m} 分 ${sec} 秒`;
  if (m > 0) return `${m} 分 ${sec} 秒`;
  return `${sec} 秒`;
}
function fmtTime(d) {
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

const KPIS = [
  { key: 'duration', label: '持续时长', icon: '⏱️', val: 0, alert: true,  sub: '发生于 ' + fmtTime(ALERT.occurredAt), fmt: () => fmtDuration(Date.now() - ALERT.occurredAt.getTime()) },
  { key: 'value',    label: '当前值',   icon: '📊', val: ALERT.value, alert: true,  sub: '阈值 ' + ALERT.threshold, fmt: () => ALERT.value.toFixed(0) + ' ' + ALERT.unit },
  { key: 'repeat',   label: '近 7 天重复', icon: '🔁', val: ALERT.history, alert: false, sub: '同触发器', fmt: () => ALERT.history + ' 次' },
  { key: 'webhooks', label: '推送渠道', icon: '📡', val: 3, alert: false, sub: '2 成功 / 1 重试成功', fmt: () => 3 + ' 个' },
];

function renderKPIs() {
  const root = document.getElementById('kpiStrip');
  root.innerHTML = KPIS.map(k => `
    <div class="kpi ${k.alert ? 'alert' : ''}">
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-body">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value-row">
          <div class="kpi-value" data-key="${k.key}">${k.fmt()}</div>
        </div>
        <div class="kpi-sub">${k.sub}</div>
      </div>
    </div>
  `).join('');
}
renderKPIs();

/* 持续时长实时更新 */
function tickDuration() {
  const el = document.querySelector('.kpi-value[data-key="duration"]');
  if (!el) return;
  const newVal = fmtDuration(Date.now() - ALERT.occurredAt.getTime());
  if (el.textContent !== newVal) {
    el.textContent = newVal;
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }
}
setInterval(tickDuration, 1000);

/* 当前值小幅扰动 */
setInterval(() => {
  ALERT.value = clamp(ALERT.value + (Math.random() - 0.5) * 16, 60, 220);
  const el = document.querySelector('.kpi-value[data-key="value"]');
  el.textContent = ALERT.value.toFixed(0) + ' ' + ALERT.unit;
  el.classList.remove('tick');
  void el.offsetWidth;
  el.classList.add('tick');
}, 4000);

/* ============================================================
 *  触发器信息
 * ============================================================ */
function renderTrig() {
  const tagsHtml = ALERT.tags.map(t => `<span class="tag ${t.sev}">${t.k} = ${t.v}</span>`).join('');
  document.getElementById('trigInfo').innerHTML = `
    <div class="trig-row">
      <div class="trig-label">触发器</div>
      <div class="trig-value highlight">${ALERT.title}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">事件 ID</div>
      <div class="trig-value">${ALERT.eventId}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">优先级</div>
      <div class="trig-value"><span class="tag warn">P2</span> 关键业务</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">关联主机</div>
      <div class="trig-value"><a href="zbxboard-host-detail-demo.html" style="color:var(--primary); text-decoration:none;">${ALERT.host}</a> <span style="color:var(--text-3);">(${ALERT.hostIp})</span></div>
    </div>
    <div class="trig-row">
      <div class="trig-label">监控项</div>
      <div class="trig-value">${ALERT.itemKey}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">触发条件</div>
      <div class="trig-value code">${ALERT.expression}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">恢复条件</div>
      <div class="trig-value code">${ALERT.recovery}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">标签</div>
      <div class="trig-value">${tagsHtml}</div>
    </div>
    <div class="trig-row">
      <div class="trig-label">描述</div>
      <div class="trig-value" style="font-family: var(--font-cn);">MySQL 慢查询数在最近 5 分钟内持续超过 100/秒，可能由缺失索引、锁等待或慢 SQL 引起。建议排查慢查询日志与执行计划。</div>
    </div>
  `;
}
renderTrig();

/* ============================================================
 *  时间线
 * ============================================================ */
const TIMELINE_ALL = [
  { time: '12:14:35', type: 'alert', content: '告警产生', strong: 'MySQL 慢查询数', rest: ' 首次超过阈值 (100/s)，当前值 128/s' },
  { time: '12:14:36', type: 'auto',  content: '采集到告警事件，写入数据库' },
  { time: '12:14:37', type: 'auto',  content: '匹配告警规则，开始推送到 3 个 Webhook 渠道' },
  { time: '12:14:38', type: 'ok',    content: '推送到 <strong>飞书 · 运维告警群</strong> 成功 (HTTP 200, 248ms)' },
  { time: '12:14:38', type: 'ok',    content: '推送到 <strong>钉钉 · DBA 群</strong> 成功 (HTTP 200, 412ms)' },
  { time: '12:14:39', type: 'failed',content: '推送到 <strong>企业微信 · 告警机器人</strong> 失败 (HTTP 500)，将进入重试' },
  { time: '12:14:44', type: 'ok',    content: '重试推送 <strong>企业微信</strong> 成功 (HTTP 200, 286ms)' },
  { time: '12:18:00', type: 'auto',  content: '指标再次攀升至 156/s，持续恶化' },

function fmtRelative(d) {
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return sec + ' 秒前';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
  if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
  return Math.floor(sec / 86400) + ' 天前';
}

function renderTimeline(filter) {
  const data = TIMELINE_ALL.filter(it => {
    if (filter === 'all') return true;
    if (filter === 'user') return it.type === 'user' || it.type === 'ok' && it.content.includes('强') && false; // user ops
    if (filter === 'auto') return it.type === 'auto' || it.type === 'alert' || it.type === 'ok' || it.type === 'failed';
    return true;
  });
  document.getElementById('timeline').innerHTML = data.map(it => `
    <div class="tl-item ${it.type === 'alert' ? 'alert' : it.type === 'user' ? 'user' : it.type === 'failed' ? 'alert' : it.type === 'ok' ? 'ok' : ''}">
      <div class="tl-time">${it.time} · ${it.type === 'user' ? '操作' : it.type === 'alert' ? '告警' : it.type === 'failed' ? '失败' : it.type === 'ok' ? '成功' : '系统'}</div>
      <div class="tl-content">
        ${it.content}
        ${it.note ? `<div class="note">${it.note}</div>` : ''}
      </div>
    </div>
  `).join('');
}

const trendChart = echarts.init(document.getElementById('trendChart'));

const TREND_LEN = 90;  // 90 个点 × 1min = 90 分钟
const TRIGGER_TIMES = [12, 30, 60, 78];  // 触发的索引
const trendData = [];
for (let i = 0; i < TREND_LEN; i++) {
  // 模拟：基线 30，偶尔飙升
  let v = 30 + Math.random() * 20;
  if (i >= 70) v += (i - 70) * 4 + Math.random() * 15;  // 末尾快速攀升
  if (TRIGGER_TIMES.includes(i)) v = 110 + Math.random() * 30;
  trendData.push(v);
}
const trendTime = Array.from({length: TREND_LEN}, (_, i) => {
  const d = new Date(Date.now() - (TREND_LEN - i - 1) * 60 * 1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
});

function trendOption() {
  const p = palette();
  return {
    backgroundColor: 'transparent',
    grid: { left: 50, right: 30, top: 30, bottom: 24 },
    legend: {
      data: ['慢查询 /s', '阈值 100'],
      textStyle: { color: p.text2, fontSize: 11 },
      right: 10, top: 4,
      itemWidth: 14, itemHeight: 8, itemGap: 16,
    },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(8, 24, 48, 0.95)',
      borderColor: p.primary,
      textStyle: { color: p.text1, fontSize: 12 },
      axisPointer: { type: 'cross', lineStyle: { color: p.primary, opacity: 0.4 } },
    },
    xAxis: {
      type: 'category',
      data: trendTime,
      boundaryGap: false,
      axisLine: { lineStyle: { color: p.text4 } },
      axisLabel: { color: p.text3, fontSize: 10, interval: 11 },
    },
    yAxis: {
      type: 'value',
      axisLine: { show: false },
      axisLabel: { color: p.text3, fontSize: 10, formatter: '{value}/s' },
      splitLine: { lineStyle: { color: 'rgba(0, 229, 255, 0.08)' } },
    },
    series: [
      {
        name: '慢查询 /s',
        type: 'line', smooth: true, symbol: 'none',
        data: trendData,
        lineStyle: { width: 1.8, color: p.danger, shadowBlur: 8, shadowColor: p.danger },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: p.danger + '88' },
            { offset: 1, color: p.danger + '00' },
          ])
        },
        markLine: {
          symbol: 'none',
          lineStyle: { color: p.warning, type: 'dashed', width: 1.5 },
          label: { color: p.warning, fontSize: 10, formatter: '阈值 100' },
          data: [{ yAxis: 100 }],
        },
        markPoint: {
          symbol: 'pin',
          symbolSize: 36,
          itemStyle: { color: p.danger, shadowBlur: 8, shadowColor: p.danger },
          label: { color: '#fff', fontSize: 9, fontWeight: 700 },
          data: TRIGGER_TIMES.map(i => ({ coord: [trendTime[i], trendData[i]], value: '告警' })),
        },
      },
      // 阈值线（重复一条做图例）
      {
        name: '阈值 100',
        type: 'line',
        data: Array(TREND_LEN).fill(100),
        symbol: 'none',
        lineStyle: { color: p.warning, type: 'dashed', width: 1.2, opacity: 0 },
        tooltip: { show: false },
      },
    ]
  };
}
trendChart.setOption(trendOption());

}

/* ============================================================
 *  Panel 3D Tilt
 * ============================================================ */
document.querySelectorAll('.panel').forEach(panel => {
  panel.addEventListener('mousemove', (e) => {
    const rect = panel.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (0.5 - y) * 2.5;
    const ry = (x - 0.5) * 2.5;
    panel.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(2px)`;
  });
  panel.addEventListener('mouseleave', () => {
    panel.style.transform = '';
  });
});
