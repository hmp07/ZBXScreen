server {
    listen 80;
    server_name _;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    root /app/static;
    index index.html;

    # 关闭版本号暴露
    server_tokens off;

    # 安全标头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 2m;
    }

    # 登录端点额外限制
    location /api/v1/auth/login {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=login_limit burst=3 nodelay;
    }

    # 运维集成反代规则（由 entrypoint 在容器启动时从模板生成）
    include /app/nginx/integrations.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
}
