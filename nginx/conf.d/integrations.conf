# =====================================================================
# ZBXScreen 运维集成反代规则
# 为 Zabbix / iTop 页面注入 Basic Auth 凭据，实现无二次登录
# =====================================================================

# ── Zabbix 主入口反代 ─────────────────────────────────────────
location /integrations/zabbix/ {
    proxy_pass ZABBIX_REAL_HOST/;       # ← 尾部斜杠剥离 /integrations/zabbix/ 前缀
    proxy_set_header Authorization "Basic ZABBIX_CREDENTIALS";
    proxy_set_header Host $http_host;
    proxy_cookie_path / /integrations/zabbix/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ── Zabbix 静态资源（页面内绝对路径引用）─────────────────────
# 先尝试匹配 ZBXScreen 本地文件，未命中时反代到 Zabbix

location /assets/ {
    try_files $uri @zabbix_backend;
}

location /js/ {
    try_files $uri @zabbix_backend;
}

location /local/ {
    try_files $uri @zabbix_backend;
}

location /chart2.php {
    proxy_pass ZABBIX_REAL_HOST/chart2.php;
    proxy_set_header Authorization "Basic ZABBIX_CREDENTIALS";
    proxy_set_header Host $http_host;
}

location /jsLoader.php {
    proxy_pass ZABBIX_REAL_HOST/jsLoader.php;
    proxy_set_header Authorization "Basic ZABBIX_CREDENTIALS";
    proxy_set_header Host $http_host;
}

location /jsrpc.php {
    proxy_pass ZABBIX_REAL_HOST/jsrpc.php;
    proxy_set_header Authorization "Basic ZABBIX_CREDENTIALS";
    proxy_set_header Host $http_host;
}

location @zabbix_backend {
    proxy_pass ZABBIX_REAL_HOST;
    proxy_set_header Authorization "Basic ZABBIX_CREDENTIALS";
    proxy_set_header Host $http_host;
}

# ── iTop 主入口反代 ─────────────────────────────────────────
location /integrations/itop/ {
    proxy_pass ITOP_REAL_HOST/;         # ← 尾部斜杠剥离前缀
    proxy_set_header Authorization "Basic ITOP_CREDENTIALS";
    proxy_set_header Host $http_host;
    proxy_cookie_path / /integrations/itop/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
