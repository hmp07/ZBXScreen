version: '3.8'

# =====================================================================
# ZBXScreen 开发环境 Docker Compose
# =====================================================================
# 本地开发用：后端代码热挂载 + 本地构建
#
# 启动: docker compose -f docker-compose.dev.yml up --build
# 前端: 建议在宿主机用 npm run dev 单独启动 (支持 HMR)
# =====================================================================

services:
  zabbixscreen-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zabbixscreen-dev
    ports:
      - "8088:80"
    volumes:
      # 后端代码热挂载：修改 Python 代码后重启容器即可
      - ./backend:/app
      # 排除 venv（如果宿主机有的话会被容器内版本覆盖）
      - /app/__pycache__
      # 数据持久化
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - APP_SECRET_KEY=dev-secret-key-do-not-use-in-production
      - DEBUG=true
      - DEFAULT_ADMIN_PASSWORD=Admin@123
      - ZABBIX_REQUEST_TIMEOUT=30
      - AGGREGATION_TOTAL_TIMEOUT=35
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
